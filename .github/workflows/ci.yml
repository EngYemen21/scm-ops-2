name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (MySQL 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"   # throw-away database of this job, reachable from the runner only
          MYSQL_DATABASE: scm_ops_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, openssl, intl, curl, fileinfo, zip, gd, sodium
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Environment (secrets generated for this run only)
        run: |
          cp .env.example .env
          sed -i "s|^DB_USERNAME=.*|DB_USERNAME=root|; s|^DB_PASSWORD=.*|DB_PASSWORD=|; s|^DB_DATABASE=.*|DB_DATABASE=scm_ops_test|" .env
          sed -i "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -hex 48)|; s|^SEED_PASSWORD=.*|SEED_PASSWORD=Ci-$(openssl rand -hex 8)|" .env
          php artisan key:generate --force
      - run: php artisan test

  backend-postgres:
    name: Backend tests (PostgreSQL 17)   # the engine of the Vercel deployment (Neon); same suite, same assertions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust   # throw-away database of this job, reachable from the runner only
          POSTGRES_USER: scm
          POSTGRES_DB: scm_ops_test
          POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"   # same collation as the Neon database: code-point order, like MySQL's sort of ASCII
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U scm" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: scm_ops_test
      DB_USERNAME: scm
      DB_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, mbstring, openssl, intl, curl, fileinfo, zip, gd, sodium
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Environment (secrets generated for this run only)
        run: |
          cp .env.example .env
          sed -i "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -hex 48)|; s|^SEED_PASSWORD=.*|SEED_PASSWORD=Ci-$(openssl rand -hex 8)|" .env
          php artisan key:generate --force
      - run: php artisan test

  client:
    name: Client check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tools/check-vue.mjs resources/js
      - run: npm run build

  onboarding:
    name: New-developer setup (php tools/setup.php --docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, openssl, intl, curl, fileinfo, zip, gd, sodium
          coverage: none
      - run: php tools/setup.php --docker --skip-node
      - name: The app answers and the demo admin can sign in
        run: |
          php artisan serve --port=8000 > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/up > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/ | grep -q 'id="app"'
          PASS=$(grep '^SEED_PASSWORD=' .env | cut -d= -f2-)
          curl -fs -X POST http://127.0.0.1:8000/api/auth/login -H 'content-type: application/json' -H 'accept: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$PASS\"}" | grep -q accessToken
