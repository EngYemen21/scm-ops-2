# Android release bundle, signed with the upload key, optionally pushed to a Google Play track. Manual trigger.
# Secrets (docs/MOBILE.md): ANDROID_KEYSTORE_B64 (the .jks, base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD; for the Play upload also PLAY_SERVICE_ACCOUNT_JSON (a Play Console service account with release rights).
name: Android (Play)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: versionCode (must increase for every upload)
        required: true
        default: '1'
      version_name:
        description: versionName shown to users
        required: true
        default: '1.0'
      track:
        description: Play track to upload to (leave empty to only build)
        required: false
        default: internal

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Web bundle for the app
        run: npm run mobile:build && npx cap sync android
      - name: Upload key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/upload.jks" "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEY_ALIAS }}" "${{ secrets.ANDROID_KEY_PASSWORD }}" > "$RUNNER_TEMP/keystore.properties"
      - name: Version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ inputs.version_code }}/; s/versionName \"[^\"]*\"/versionName \"${{ inputs.version_name }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Build signed bundle
        working-directory: android
        env:
          KEYSTORE_PROPERTIES: ${{ runner.temp }}/keystore.properties
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with: { name: app-release-aab, path: android/app/build/outputs/bundle/release/app-release.aab }
      - name: Upload to Google Play
        if: ${{ inputs.track != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: sa.b2b.ops
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed
