# iOS build + upload to TestFlight on a macOS runner. Manual trigger. Needs these repository secrets (docs/MOBILE.md):
#   APPLE_TEAM_ID             the 10-character team id (Apple Developer → Membership)
#   ASC_KEY_ID, ASC_ISSUER_ID App Store Connect API key (Users and Access → Integrations → App Store Connect API)
#   ASC_KEY_P8                the key file contents (AuthKey_XXXX.p8), base64-encoded
# Signing is Xcode cloud-managed through that key: no certificate or profile is stored anywhere.
# The project uses Swift Package Manager (Capacitor 8): no CocoaPods, no workspace — xcodebuild resolves the packages,
# which point at node_modules/@capacitor/*, so `npm ci` must run first.
name: iOS (TestFlight)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (must increase for every upload)
        required: true
        default: '1'
      api_origin:
        description: Server the app talks to
        required: true
        default: https://scm-ops-laravel.vercel.app

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VITE_API_ORIGIN: ${{ inputs.api_origin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Web bundle for the app
        run: npm run mobile:build && npx cap sync ios
      - name: Server address baked into the app
        run: grep -rl "${VITE_API_ORIGIN#https://}" mobile/www/assets/*.js | head -1 || (echo "server address missing from the bundle" && exit 1)
      - name: Xcode
        run: xcodebuild -version
      - name: App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: Archive
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CURRENT_PROJECT_VERSION="${{ inputs.build_number }}" \
            -allowProvisioningUpdates -allowProvisioningDeviceRegistration -skipPackagePluginValidation \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*signing|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/App.xcarchive" || (tail -80 "$RUNNER_TEMP/archive.log"; exit 1)
      - name: Export and upload to App Store Connect
        working-directory: ios/App
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ../ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export
          if-no-files-found: ignore
