# iOS build + upload to TestFlight on a macOS runner. Manual trigger. Needs these repository secrets (docs/MOBILE.md):
#   APPLE_TEAM_ID             the 10-character team id (Apple Developer → Membership)
#   ASC_KEY_ID, ASC_ISSUER_ID App Store Connect API key (Users and Access → Integrations → App Store Connect API)
#   ASC_KEY_P8                the key file contents (AuthKey_XXXX.p8), base64-encoded
# Signing is Xcode cloud-managed through that key: no certificate or profile is stored anywhere.
# The project uses Swift Package Manager (Capacitor 8): no CocoaPods, no workspace — xcodebuild resolves the packages,
# which point at node_modules/@capacitor/*, so `npm ci` must run first.
name: iOS (TestFlight)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (must increase for every upload)
        required: true
        default: '1'
      api_origin:
        description: Server the app talks to
        required: true
        default: https://scm-ops-laravel.vercel.app

jobs:
  ios:
    # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26) or later.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VITE_API_ORIGIN: ${{ inputs.api_origin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Web bundle for the app
        run: npm run mobile:build && npx cap sync ios
      - name: Server address baked into the app
        run: grep -rl "${VITE_API_ORIGIN#https://}" mobile/www/assets/*.js | head -1 || (echo "server address missing from the bundle" && exit 1)
      - name: Xcode 26 (newest installed)
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE "beta|rc" | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || { echo "no Xcode 26 on this runner — App Store Connect requires the iOS 26 SDK"; exit 1; }
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos"
      - name: App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: Archive
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CURRENT_PROJECT_VERSION="${{ inputs.build_number }}" \
            -allowProvisioningUpdates -allowProvisioningDeviceRegistration -skipPackagePluginValidation \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*signing|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/App.xcarchive" || (tail -80 "$RUNNER_TEMP/archive.log"; exit 1)
      # Distribution signing: the certificate + App Store profile from tools/ios-signing.mjs (secrets IOS_DIST_P12_B64,
      # IOS_DIST_P12_PASSWORD, IOS_PROFILE_B64, IOS_PROFILE_NAME). The archive is re-signed with them at export — the
      # App Manager API key cannot use Apple's cloud-managed distribution signing (that needs an Admin key).
      - name: Distribution certificate and profile
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/appstore.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "profile $UUID installed"
      - name: Export and upload to App Store Connect
        working-directory: ios/App
        run: |
          sed -e "s/__PROFILE_NAME__/${{ secrets.IOS_PROFILE_NAME }}/" -e "s/__TEAM_ID__/${{ secrets.APPLE_TEAM_ID }}/" ../ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export
          if-no-files-found: ignore
